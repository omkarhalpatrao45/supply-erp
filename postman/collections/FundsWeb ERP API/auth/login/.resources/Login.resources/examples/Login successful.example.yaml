$kind: http-example
request:
  url: "{{baseUrl}}/auth/login"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "email": "admin@supplyerp.local",
        "password": "Password@123"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
        "user": {
          "id": 1,
          "name": "System Administrator",
          "email": "admin@supplyerp.local",
          "role": "ADMIN"
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "token": {
            "type": "string",
            "example": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          },
          "user": {
            "type": "object",
            "properties": {
              "id": {
                "type": "integer",
                "example": 1
              },
              "name": {
                "type": "string",
                "example": "System Administrator"
              },
              "email": {
                "type": "string",
                "example": "admin@supplyerp.local"
              },
              "role": {
                "type": "string",
                "enum": [
                  "ADMIN",
                  "SALES_USER"
                ],
                "example": "ADMIN"
              }
            }
          }
        }
      }
order: 1000
