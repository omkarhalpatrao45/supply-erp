$kind: http-example
request:
  url: "{{baseUrl}}/quotations/:id/status"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: "9681"
      disabled: false
      description: Quotation ID
  body:
    type: json
    content: |-
      {
        "status": "ACCEPTED"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 1,
        "status": "ACCEPTED"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "example": 1
          },
          "status": {
            "type": "string",
            "example": "ACCEPTED"
          }
        }
      }
order: 1000
