$kind: http-request
description: ""
url: "{{baseUrl}}/customers"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "company_name": "Apex Industries",
      "contact_person": "Ravi Shah",
      "mobile": "string",
      "email": "ravi@apex.in",
      "city": "Mumbai"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "company_name": {
          "type": "string",
          "example": "Apex Industries"
        },
        "contact_person": {
          "type": "string",
          "example": "Ravi Shah"
        },
        "mobile": {
          "type": "string",
          "example": 9876500001
        },
        "email": {
          "type": "string",
          "example": "ravi@apex.in"
        },
        "city": {
          "type": "string",
          "example": "Mumbai"
        }
      },
      "required": [
        "company_name",
        "contact_person",
        "mobile"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Create customer.resources/examples
order: 2000
