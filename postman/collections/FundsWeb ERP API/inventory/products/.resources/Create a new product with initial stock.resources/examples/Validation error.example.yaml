$kind: http-example
request:
  url: "{{baseUrl}}/inventory/products"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "product_code": "PROD-021",
        "product_name": "Hydraulic Pump",
        "category": "Automation",
        "unit": "Unit",
        "base_price": 32000,
        "physical_qty": 50
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Invalid email or password."
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string",
            "example": "Invalid email or password."
          }
        }
      }
order: 2000
