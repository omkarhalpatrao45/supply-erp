$kind: http-example
request:
  url: "{{baseUrl}}/inventory/products"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "product_code": "PROD-021",
        "product_name": "Hydraulic Pump",
        "category": "Automation",
        "unit": "Unit",
        "base_price": 32000,
        "physical_qty": 50
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "product_id": 1,
        "product_code": "PROD-001",
        "product_name": "Industrial Gearbox",
        "category": "Mechanical",
        "unit": "Unit",
        "base_price": 42000,
        "physical_qty": 120,
        "reserved_qty": 5,
        "available_qty": 115
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "product_id": {
            "type": "integer",
            "example": 1
          },
          "product_code": {
            "type": "string",
            "example": "PROD-001"
          },
          "product_name": {
            "type": "string",
            "example": "Industrial Gearbox"
          },
          "category": {
            "type": "string",
            "example": "Mechanical"
          },
          "unit": {
            "type": "string",
            "example": "Unit"
          },
          "base_price": {
            "type": "number",
            "example": 42000
          },
          "physical_qty": {
            "type": "integer",
            "example": 120
          },
          "reserved_qty": {
            "type": "integer",
            "example": 5
          },
          "available_qty": {
            "type": "integer",
            "example": 115
          }
        }
      }
order: 1000
