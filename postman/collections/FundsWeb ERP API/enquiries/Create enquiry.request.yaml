$kind: http-request
description: ""
url: "{{baseUrl}}/enquiries"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "customer_id": 1,
      "required_date": "2026-10-05",
      "products": [
        {
          "product_id": 3,
          "quantity": 10
        },
        {
          "product_id": 3,
          "quantity": 10
        }
      ],
      "enquiry_date": "2026-09-27",
      "notes": "Urgent requirement for production line upgrade."
    }
  $type: |-
    {
