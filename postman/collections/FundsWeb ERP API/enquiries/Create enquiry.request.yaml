      "properties": {
        "customer_id": {
          "type": "integer",
          "example": 1
        },
        "enquiry_date": {
          "type": "string",
          "example": "2026-09-27",
          "format": "date"
        },
        "required_date": {
          "type": "string",
          "example": "2026-10-05",
          "format": "date"
        },
        "notes": {
          "type": "string",
          "example": "Urgent requirement for production line upgrade."
        },
        "products": {
          "type": "array",
          "items": {
            "type": "object",
            "properties": {
              "product_id": {
                "type": "integer",
                "example": 3
              },
              "quantity": {
                "type": "integer",
                "example": 10
              }
            }
          }
        }
      },
      "required": [
        "customer_id",
        "required_date",
        "products"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
