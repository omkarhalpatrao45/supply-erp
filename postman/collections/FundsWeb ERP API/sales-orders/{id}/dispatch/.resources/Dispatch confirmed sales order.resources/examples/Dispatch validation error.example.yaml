$kind: http-example
request:
  url: "{{baseUrl}}/sales-orders/:id/dispatch"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "9681"
  body:
    type: json
    content: |-
      {
        "dispatch_date": "2026-10-02",
        "vehicle_number": "MH12AB1234",
        "driver_name": "Ravi Kumar"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Invalid email or password."
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string",
            "example": "Invalid email or password."
          }
        }
      }
order: 2000
